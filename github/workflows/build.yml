name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Create Android project
        run: |
          flutter create --platforms=android --org com.wirdi --project-name wirdi app
          rm -rf app/test
          cp main.dart app/lib/main.dart
          cat > app/pubspec.yaml <<'EOF'
          name: wirdi
          description: وردي اليومي
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.5.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.3.2
            flutter_local_notifications: ^17.2.3
            timezone: ^0.9.4
          flutter:
            uses-material-design: true
          EOF
      - name: Patch Android config
        run: |
          python3 - <<'PY'
          import os, re
          root = 'app/android/app'
          mp = os.path.join(root, 'src/main/AndroidManifest.xml')
          s = open(mp, encoding='utf-8').read()
          perms = ('    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
                   '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'
                   '    <uses-permission android:name="android.permission.VIBRATE"/>\n')
          recv = ('        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>\n'
                  '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
                  '                <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n'
                  '                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n')
          s = s.replace('<application', perms + '    <application', 1)
          s = s.replace('</application>', recv + '    </application>', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="وردي"', s, count=1)
          open(mp, 'w', encoding='utf-8').write(s)
          for name in ['build.gradle', 'build.gradle.kts']:
              p = os.path.join(root, name)
              if not os.path.exists(p):
                  continue
              g = open(p, encoding='utf-8').read()
              kts = name.endswith('.kts')
              flag = 'isCoreLibraryDesugaringEnabled = true' if kts else 'coreLibraryDesugaringEnabled true'
              g = re.sub(r'(compileOptions\s*\{)', lambda m: m.group(1) + '\n        ' + flag, g, count=1)
              if kts:
                  g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n'
              else:
                  g += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n}\n"
              open(p, 'w', encoding='utf-8').write(g)
              print('patched', p)
          PY
      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: wird-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
